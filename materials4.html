<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>3D Model - Bar</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
            font-family: 'Sarabun', 'Segoe UI', sans-serif
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh
        }

        #infoPanel {
            display: none;
            position: fixed;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            width: 300px;
            max-width: 80vw;
            background: rgba(20, 20, 20, .92);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 14px;
            padding: 20px;
            color: #fff;
            z-index: 20;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .4)
        }

        #infoPanel h2 {
            margin: 0 0 10px;
            font-size: 18px;
            color: #ff5a5f
        }

        #infoPanel p {
            margin: 4px 0;
            font-size: 14px;
            line-height: 1.5;
            opacity: .9
        }

        #infoPanel button {
            margin-top: 14px;
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: #fff;
            cursor: pointer
        }

        #infoPanel button:hover {
            background: #555
        }

        #hint {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, .55);
            font-size: 13px;
            z-index: 5;
            pointer-events: none;
            text-align: center
        }

        #debugBox {
            position: fixed;
            top: 14px;
            right: 14px;
            background: rgba(0, 0, 0, .6);
            color: #0f0;
            font-family: monospace;
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 8px;
            z-index: 30;
            display: none
        }
    </style>
</head>

<body>

    <div id="hint">รอซักครู่ โมเดลกำลังโหลด...</div>
    <div id="debugBox"></div>

    <div id="infoPanel">
        <div id="infoPanelContent"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

    <script>

        const CURTAIN_OBJECT_NAMES = [
            "Plane041", "Plane.041",
            "Plane045", "Plane.045",
            "Plane062", "Plane.062",
            "Plane063", "Plane.063",
            "Plane064", "Plane.064",
            "Plane065", "Plane.065",
            "Plane066", "Plane.066",
            "Plane067", "Plane.067",
            "Plane068", "Plane.068",
            "Plane069", "Plane.069",
            "Plane070", "Plane.070",
            "Plane071", "Plane.071",
            "Plane072", "Plane.072",
            "Plane073", "Plane.073",
            "Plane074", "Plane.074",
            "Plane075", "Plane.075",
            "Plane076", "Plane.076",
            "Plane077", "Plane.077",
            "Plane078", "Plane.078",
            "Plane079", "Plane.079"
        ];

        const EXCLUDE_NAMES = [];

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfffdd0);

        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.01,
            1000
        );

        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2; // ปรับให้สว่างและสีสันสด
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

        controls.enableDamping = true;
        controls.dampingFactor = .08;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.25); 
        scene.add(ambientLight);

        const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0x222222, 0.3); 
        hemisphereLight.position.set(0, 50, 0);
        scene.add(hemisphereLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.3); 
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;

        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = .1;
        directionalLight.shadow.camera.far = 100;
        directionalLight.shadow.bias = -.0005;
        directionalLight.shadow.normalBias = .02;

        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0x99bbff, .35);
        fillLight.position.set(-10, 5, -5);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffffff, .45);
        rimLight.position.set(0, 8, -12);
        scene.add(rimLight);

        function createToonGradientTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 4;
            canvas.height = 1;

            const ctx = canvas.getContext('2d');

           
            ctx.fillStyle = 'rgb(90,90,90)';     
            ctx.fillRect(0, 0, 1, 1);

            ctx.fillStyle = 'rgb(140,140,140)';  
            ctx.fillRect(1, 0, 1, 1);

            ctx.fillStyle = 'rgb(200,200,200)';  
            ctx.fillRect(2, 0, 1, 1);

            ctx.fillStyle = 'rgb(255,255,255)';  
            ctx.fillRect(3, 0, 1, 1);

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.NearestFilter;
            texture.magFilter = THREE.NearestFilter;
            texture.generateMipmaps = false;

            return texture;
        }
        const toonGradientMap = createToonGradientTexture();

        let modelRoot = null;

        let projectsButtonObj = null;
        let creditsButtonObj = null;
        let aboutmeButtonObj = null;
        let pictureButtonObj = null;

        let projectsTargetObj = null;
        let creditsTargetObj = null;
        let aboutmeTargetObj = null;
        let pictureTargetObj = null;

        let projectsButton2Obj = null;
        let aboutmeBMButtonObj = null;
        let pictureButton2Obj = null;

        let defaultCamPos = new THREE.Vector3();
        let defaultCamTarget = new THREE.Vector3();

        const curtainAnimations = [];
        const clock = new THREE.Clock();

        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        loader.load('https://media.githubusercontent.com/media/chayaponsaenthavee/Ball/main/Store18.glb', (gltf) => {
            const model = gltf.scene;
            modelRoot = model;
            model.rotation.y = -Math.PI / 2;

            model.traverse((node) => {
                if (!node.isMesh) return;

                const originalMaterial = node.material;
                const originalMap = originalMaterial && !Array.isArray(originalMaterial) && originalMaterial.map ? originalMaterial.map : null;
                const originalColor = originalMaterial && !Array.isArray(originalMaterial) && originalMaterial.color ? originalMaterial.color.clone() : new THREE.Color(0xffffff);

                const lowerName = node.name.toLowerCase();
                const isCurtain = CURTAIN_OBJECT_NAMES.includes(node.name);
                const isAirConditioner = lowerName.includes('ac') || lowerName.includes('air') || lowerName.includes('conditioner');
                const isExcluded = EXCLUDE_NAMES.includes(node.name);

                /*ผ้าม่าน*/
                if (isCurtain) {
                    node.material = originalMaterial;

                    if (Array.isArray(node.material)) {
                        node.material.forEach((material) => {
                            if (material) {
                                material.side = THREE.DoubleSide;
                                material.visible = true;
                                material.needsUpdate = true;
                            }
                        });
                    } else if (node.material) {
                        node.material.side = THREE.DoubleSide;
                        node.material.visible = true;
                        node.material.needsUpdate = true;
                    }

                    node.visible = true;
                    node.frustumCulled = false;
                    node.castShadow = false;
                    node.receiveShadow = false;
                } else {
                    node.castShadow = true;
                    node.receiveShadow = true;
                }

                /*PBR*/
                if (!isCurtain && node.name.startsWith('Cylinder')) {
                    node.material = new THREE.MeshStandardMaterial({
                        map: originalMap,
                        color: originalColor,
                        metalness: 0.9,
                        roughness: 0.2,
                        side: THREE.DoubleSide
                    });
                    node.material.needsUpdate = true;
                }

                /*CEL SHADING */
                if (!isCurtain &&
                    (
                        node.name.startsWith('Icosphere') ||
                        (node.name.startsWith('Cube') && !node.name.startsWith('Cube021') && !node.name.startsWith('Cube019')) ||
                        lowerName.includes('bottle') ||
                        lowerName.includes('glass') ||
                        lowerName.includes('arcade')
                    )
                ) {
                   node.material = new THREE.MeshToonMaterial({
                        map: originalMap,
                        color: originalColor,
                        emissive: originalColor,     
                        emissiveIntensity: 0.35,     
                        gradientMap: toonGradientMap,
                        side: THREE.DoubleSide
                    });
                    node.material.needsUpdate = true;
                }

                /*BUTTONS & TARGETS*/
                if (node.name === 'Text001') projectsButtonObj = node;
                if (node.name === 'Text002') aboutmeButtonObj = node;
                if (node.name === 'Text005') pictureButtonObj = node;
                if (node.name === 'Cube022') projectsTargetObj = node;
                if (node.name === 'Cube020') aboutmeTargetObj = node;
                if (node.name === 'Plane038') pictureTargetObj = node;
                if (node.name === 'Text009') projectsButton2Obj = node;
                if (node.name === 'Text007') aboutmeBMButtonObj = node;
                if (node.name === 'Text008') pictureButton2Obj = node;

                /*ผ้าม่านพริ้ว*/
                if (
                    isCurtain &&
                    !isAirConditioner &&
                    !isExcluded &&
                    node.geometry &&
                    node.material
                ) {
                    node.geometry = node.geometry.clone();
                    const geometry = node.geometry;
                    const positionAttribute = geometry.getAttribute('position');

                    if (positionAttribute) {
                        geometry.computeBoundingBox();
                        const minY = geometry.boundingBox.min.y;
                        const maxY = geometry.boundingBox.max.y;
                        const basePositions = new Float32Array(positionAttribute.array);

                        curtainAnimations.push({
                            node: node,
                            geometry: geometry,
                            position: positionAttribute,
                            base: basePositions,
                            minY: minY,
                            maxY: maxY,
                            offset: node.position.x * 12.34 + node.position.z * 4.71
                        });

                        node.visible = true;
                        node.frustumCulled = false;
                        node.castShadow = false;
                        node.receiveShadow = false;

                        if (Array.isArray(node.material)) {
                            node.material.forEach((material) => {
                                if (material) {
                                    material.side = THREE.DoubleSide;
                                    material.needsUpdate = true;
                                }
                            });
                        } else {
                            node.material.side = THREE.DoubleSide;
                            node.material.needsUpdate = true;
                        }
                    }
                }
            });

            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            model.position.sub(center);

            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            const cameraZ = Math.abs(maxDim / (2 * Math.tan(fov / 2))) * .8;

            camera.position.set(0, 0, cameraZ);
            controls.target.set(0, 0, 0);
            controls.update();

            defaultCamPos.copy(camera.position);
            defaultCamTarget.copy(controls.target);

            directionalLight.shadow.camera.left = -maxDim;
            directionalLight.shadow.camera.right = maxDim;
            directionalLight.shadow.camera.top = maxDim;
            directionalLight.shadow.camera.bottom = -maxDim;
            directionalLight.shadow.camera.updateProjectionMatrix();

            scene.add(model);
            animate();

        }, undefined, (error) => {
            console.error('เกิดข้อผิดพลาดในการโหลดโมเดล:', error);
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('click', (event) => {
            if (!modelRoot) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(modelRoot, true);

            const debugBox = document.getElementById('debugBox');

            if (intersects.length === 0) {
                closeInfoPanel();
                debugBox.style.display = 'block';
                debugBox.innerText = 'รีเซ็ตกล้อง';
                return;
            }

            const hit = intersects[0].object;
            debugBox.style.display = 'block';
            debugBox.innerText = 'คลิกโดน: ' + hit.name;

            if (hit === projectsButtonObj) {
                focusOnObject(projectsTargetObj, 2.2);
                openInfoPanel('<h2>Projects</h2><p>รายละเอียดผลงานและโปรเจกต์</p>');
            } else if (hit === aboutmeButtonObj) {
                focusOnObject(aboutmeTargetObj, 2.2);
                openInfoPanel('<h2>About Me</h2><p>ข้อมูลประวัติส่วนตัว</p>');
            } else if (hit === pictureButtonObj) {
                focusOnObject(pictureTargetObj, 1.4);
                openInfoPanel('<h2>Picture Gallery</h2><p>รูปภาพ</p>');
            } else if (
                hit === projectsButton2Obj ||
                hit === aboutmeBMButtonObj ||
                hit === pictureButton2Obj
            ) {
                closeInfoPanel();
            }
        });

        let flyAnim = null;

        function focusOnObject(obj, distanceMultiplier = 2.2) {
            if (!obj) return;

            const box = new THREE.Box3().setFromObject(obj);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z, .2);

            const dir = new THREE.Vector3()
                .subVectors(camera.position, controls.target)
                .normalize();

            const targetCamPos = center.clone().add(
                dir.multiplyScalar(maxDim * distanceMultiplier)
            );

            flyCameraTo(targetCamPos, center);
        }

        function flyCameraTo(targetPos, targetLook, duration = 900) {
            if (flyAnim) {
                cancelAnimationFrame(flyAnim.id);
            }

            const startPos = camera.position.clone();
            const startTarget = controls.target.clone();
            const startTime = performance.now();

            controls.enabled = false;

            function step(now) {
                const t = Math.min((now - startTime) / duration, 1);
                const ease = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

                camera.position.lerpVectors(startPos, targetPos, ease);
                controls.target.lerpVectors(startTarget, targetLook, ease);
                controls.update();

                if (t < 1) {
                    flyAnim = { id: requestAnimationFrame(step) };
                } else {
                    controls.enabled = true;
                }
            }

            flyAnim = { id: requestAnimationFrame(step) };
        }

        function resetCamera() {
            flyCameraTo(defaultCamPos, defaultCamTarget);
        }

        const infoPanelEl = document.getElementById('infoPanel');
        const infoPanelContentEl = document.getElementById('infoPanelContent');
        const hintEl = document.getElementById('hint');

        function openInfoPanel(html) {
            infoPanelContentEl.innerHTML = html;
            infoPanelEl.style.display = 'block';
            if (hintEl) hintEl.style.display = 'none';
        }

        function closeInfoPanel() {
            infoPanelEl.style.display = 'none';
            resetCamera();
            if (hintEl) hintEl.style.display = 'block';
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /*Animation Loop*/
        function smootherstep(min, max, value) {
            if (min === max) return value >= max ? 1 : 0;
            const x = Math.max(0, Math.min(1, (value - min) / (max - min)));
            // สูตร 5th order smoothstep
            return x * x * x * (x * (x * 6 - 15) + 10);
        }
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const t = clock.getElapsedTime();

            curtainAnimations.forEach((curtain) => {
                const position = curtain.position;
                const base = curtain.base;
                const minY = curtain.minY;
                const maxY = curtain.maxY;
                const range = Math.max(maxY - minY, 0.0001);
                const offset = curtain.offset;

                for (let i = 0; i < position.count; i++) {
                    const index = i * 3;
                    const x = base[index];
                    const y = base[index + 1];
                    const z = base[index + 2];

                    const height01 = Math.max(0, Math.min(1, (y - minY) / range));
                    const waveFactor = Math.pow(1 - height01, 1.5);

                    const waveX = Math.sin(t * 2.5 + z * 3.0 + offset) * 0.03 * waveFactor;
                    const waveZ = Math.cos(t * 2.0 + x * 3.0 + offset) * 0.03 * waveFactor;

                    position.setXYZ(i, x + waveX, y, z + waveZ);
                }

                position.needsUpdate = true;
            });

            renderer.render(scene, camera);
        }

    </script>
</body>

</html>
