<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Assignment #3: Next Gen Rendering </title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #05050a;
        }

        #info {
            position: absolute;
            top: 25px;
            left: 25px;
            color: #e0f7fc;
            font-size: 13px;
            line-height: 1.6;
            background: rgba(10, 15, 30, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 16px 20px;
            border-radius: 12px;
            border-left: 4px solid #00f0ff;
            border-top: 1px solid rgba(0, 240, 255, 0.3);
            border-right: 1px solid rgba(0, 240, 255, 0.1);
            border-bottom: 1px solid rgba(0, 240, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 10;
        }

       
        .lil-gui {
            --background-color: rgba(10, 15, 28, 0.85) !important;
            --text-color: #e0f7fc !important;
            --title-background-color: rgba(0, 240, 255, 0.15) !important;
            --widget-color: rgba(0, 240, 255, 0.1) !important;
            --hover-color: rgba(0, 240, 255, 0.25) !important;
            --focus-color: #00f0ff !important;
            --number-color: #00f0ff !important;
            --string-color: #ff007f !important;
            --font-family: 'Segoe UI', sans-serif !important;
            --font-size: 13px !important;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 12px !important;
            border: 1px solid rgba(0, 240, 255, 0.4) !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 240, 255, 0.2) !important;
            overflow: visible !important;
            top: 25px !important;
            right: 25px !important;
            width: 300px !important;
        }

        .lil-gui .title {
            font-weight: 700 !important;
            letter-spacing: 1px !important;
            font-size: 12px !important;
            color: #00f0ff !important;
            padding: 10px 12px !important;
            height: auto !important;
            line-height: normal !important;
        }

        .lil-gui .folder {
            border-bottom: 1px solid rgba(0, 240, 255, 0.15) !important;
        }

        .lil-gui .children {
            padding: 6px 4px !important;
        }

        .lil-gui .controller {
            margin: 6px 8px !important;
            height: auto !important;
        }

        .lil-gui .slider {
            background: rgba(0, 240, 255, 0.15) !important;
            border-radius: 6px !important;
        }

        .lil-gui .slider-fill {
            background: #00f0ff !important;
            border-radius: 6px !important;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
        }
    </style>
</head>

<body>
    


    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>

    <script>
      
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

    
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 3.5, 8);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1.2, 0);

  
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xfffaed, 2.0);
        directionalLight.position.set(5, 8, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        const lightHelper = new THREE.DirectionalLightHelper(directionalLight, 1);
        scene.add(lightHelper);

       
        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/snowy_forest_path_02_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        const exrLoader = new THREE.EXRLoader();
        exrLoader.setDataType(THREE.FloatType);
        exrLoader.load(exrSkyboxUrl, (texture) => {
            const exrCubeMap = pmremGenerator.fromEquirectangular(texture).texture;
            scene.background = exrCubeMap;
            scene.environment = exrCubeMap;
            texture.dispose();
            pmremGenerator.dispose();
        }, undefined, (err) => {
            console.error('Error loading EXR:', err);
        });

        const textureLoader = new THREE.TextureLoader();
        const texFloor = textureLoader.load('https://sibsansuk.github.io/mossy_cobblestone_diff_1k.jpg');
        texFloor.wrapS = THREE.RepeatWrapping;
        texFloor.wrapT = THREE.RepeatWrapping;
        texFloor.repeat.set(4, 4);

        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            roughness: 0.6,
            metalness: 0.1,
            side: THREE.DoubleSide
        });
        const planeGeometry = new THREE.PlaneGeometry(16, 16);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

      
        const texStone = textureLoader.load('https://sibsansuk.github.io/mossy_cobblestone_diff_1k.jpg');
        texStone.wrapS = THREE.RepeatWrapping;
        texStone.wrapT = THREE.RepeatWrapping;
        texStone.repeat.set(1.5, 1.5);

        const stoneMaterial = new THREE.MeshStandardMaterial({
            map: texStone,
            color: 0xc49a6c,
            roughness: 0.65,
            metalness: 0.1,
            bumpMap: texStone,
            bumpScale: 0.05
        });

        const rockMaterial = new THREE.MeshStandardMaterial({
            map: texStone,
            color: 0x8a7b70,
            roughness: 0.8,
            metalness: 0.05,
            bumpMap: texStone,
            bumpScale: 0.08
        });

        function createPBRRock(x, z, scaleX = 1, scaleY = 1, scaleZ = 1, rotY = 0) {
            const rockGeo = new THREE.DodecahedronGeometry(0.75, 1);
            const rock = new THREE.Mesh(rockGeo, rockMaterial);
            rock.scale.set(scaleX, scaleY, scaleZ);
            rock.position.set(x, (0.75 * scaleY) / 2.2, z);
            rock.rotation.set(0.1, rotY, 0.1);
            rock.castShadow = true;
            rock.receiveShadow = true;
            scene.add(rock);
        }

        function createStoneArch(x, z) {
            const archGroup = new THREE.Group();
            const pillarGeo = new THREE.BoxGeometry(0.6, 3.5, 0.6);
            const pillarLeft = new THREE.Mesh(pillarGeo, stoneMaterial);
            pillarLeft.position.set(-1.8, 1.75, 0);
            pillarLeft.castShadow = true;
            pillarLeft.receiveShadow = true;

            const pillarRight = new THREE.Mesh(pillarGeo, stoneMaterial);
            pillarRight.position.set(1.8, 1.75, 0);
            pillarRight.castShadow = true;
            pillarRight.receiveShadow = true;

            const beamGeo = new THREE.BoxGeometry(4.6, 0.6, 0.8);
            const topBeam = new THREE.Mesh(beamGeo, stoneMaterial);
            topBeam.position.set(0, 3.8, 0);
            topBeam.castShadow = true;
            topBeam.receiveShadow = true;

            archGroup.add(pillarLeft, pillarRight, topBeam);
            archGroup.position.set(x, 0, z);
            scene.add(archGroup);
        }

        function createAncientPillar(x, z, height) {
            const pillarGroup = new THREE.Group();
            const baseGeo = new THREE.BoxGeometry(0.8, 0.3, 0.8);
            const base = new THREE.Mesh(baseGeo, stoneMaterial);
            base.position.y = 0.15;
            base.castShadow = true;
            base.receiveShadow = true;

            const colGeo = new THREE.CylinderGeometry(0.3, 0.35, height, 16);
            const column = new THREE.Mesh(colGeo, stoneMaterial);
            column.position.y = height / 2 + 0.3;
            column.castShadow = true;
            column.receiveShadow = true;

            pillarGroup.add(base, column);
            pillarGroup.position.set(x, 0, z);
            scene.add(pillarGroup);
        }

        
        const gltfLoader2 = new THREE.GLTFLoader();
        gltfLoader2.load('https://cdn.jsdelivr.net/gh/chayaponsaenthavee/Ball@main/sakura.glb', (gltf) => {
            const sakuraLeft = gltf.scene;
            sakuraLeft.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.material) {
                        child.material.needsUpdate = true;
                    }
                }
            });
           
            sakuraLeft.position.set(-4, -0.25, 3);
            sakuraLeft.scale.set(2.2, 2.2, 2.2);
            scene.add(sakuraLeft);

            
            const sakuraRight = sakuraLeft.clone();
            sakuraRight.position.set(4, -0.25, 3);
            sakuraRight.rotation.y = Math.PI / 2;
            scene.add(sakuraRight);
        });

        createStoneArch(0, -2.5);
        createAncientPillar(-4, -1, 3.0);
        createAncientPillar(4, -1, 2.4);

        createPBRRock(-2.6, -1.8, 1.3, 0.9, 1.1, 0.4);
        createPBRRock(2.6, -1.8, 1.4, 1.0, 1.2, 1.2);
        createPBRRock(-4.7, 1.2, 1.7, 1.2, 1.5, 2.1);
        createPBRRock(4.6, 1.0, 1.3, 0.8, 1.2, 0.8);
        createPBRRock(-1.8, 3.2, 1.0, 0.7, 0.9, 1.5);
        createPBRRock(2.2, 3.5, 1.2, 0.8, 1.0, 2.8);

     
        let mainModel;
        const gltfLoader = new THREE.GLTFLoader();
        gltfLoader.load('https://cdn.jsdelivr.net/gh/chayaponsaenthavee/Ball@main/anime15.glb', (gltf) => {
            mainModel = gltf.scene;
            
            mainModel.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.material) {
                        child.material.needsUpdate = true;
                    }
                }
            });

            mainModel.position.set(0, 0, 0);
            scene.add(mainModel);
        });

    
        let enableMouseLight = true;
        window.addEventListener('mousemove', (event) => {
            if (!enableMouseLight) return;
            const mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            const mouseY = -(event.clientY / window.innerHeight) * 2 + 1;

            directionalLight.position.x = mouseX * 10;
            directionalLight.position.y = Math.max(1, mouseY * 10 + 5);
            lightHelper.update();
        });

      
        const gui = new lil.GUI({ title: ' PBR CONTROL PANEL' });
        
        const lightFolder = gui.addFolder(' LIGHT SOURCE');
        lightFolder.add({ mouseControl: true }, 'mouseControl').name('Mouse Tracking').onChange((val) => {
            enableMouseLight = val;
        });
        lightFolder.add(directionalLight.position, 'x', -10, 10, 0.1).name('Pos X').listen().onChange(() => lightHelper.update());
        lightFolder.add(directionalLight.position, 'y', 1, 15, 0.1).name('Pos Y').listen().onChange(() => lightHelper.update());
        lightFolder.add(directionalLight.position, 'z', -10, 10, 0.1).name('Pos Z').listen().onChange(() => lightHelper.update());
        lightFolder.add(directionalLight, 'intensity', 0, 5, 0.1).name('Intensity');
        lightFolder.open();

       
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>

</html>
