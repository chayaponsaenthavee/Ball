<!DOCTYPE html>
<html>

<head>
    <title>Assignment #3: Next Gen Rendering (PBR)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>

    <script>
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const lightHelper = new THREE.DirectionalLightHelper(directionalLight, 0.5);
        scene.add(lightHelper);

        // HDRI Skybox
        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/venice_sunset_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });

        // ------------------------------------------------------------------
        // โหลดโมเดลจิ้งจอก (anime6.glb)
        // ------------------------------------------------------------------
        const animeGroup = new THREE.Group();
        animeGroup.position.set(-2.2, 0, 1);
        animeGroup.scale.set(0.8, 0.8, 0.8);
        scene.add(animeGroup);

        const animeLoader = new THREE.GLTFLoader();
        animeLoader.load('https://cdn.jsdelivr.net/gh/chayaponsaenthavee/Ball@main/anime6.glb', (gltf) => {
            const animeModel = gltf.scene;

            const box = new THREE.Box3().setFromObject(animeModel);
            const center = box.getCenter(new THREE.Vector3());

            animeModel.position.x -= center.x;
            animeModel.position.y -= box.min.y;
            animeModel.position.z -= center.z;

            animeModel.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            animeGroup.add(animeModel);
        });

        // ------------------------------------------------------------------
        // สร้างพื้น (เปลี่ยน URL ของ Texture เป็นลิงก์ที่ปลอดภัย)
        // ------------------------------------------------------------------
        const texFloor = new THREE.TextureLoader().load('https://threejs.org/examples/textures/brick_diffuse.jpg');
        texFloor.wrapS = THREE.RepeatWrapping;
        texFloor.wrapT = THREE.RepeatWrapping;
        texFloor.repeat.set(4, 4);

        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            side: THREE.DoubleSide,
            roughness: 0.8,
            metalness: 0.2
        });
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        // Spheres
        const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        const sphereMaterial = new THREE.MeshBasicMaterial({ color: 0x00FF00 });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.set(2, 1, -2);
        scene.add(sphere);

        const lambertSphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        const lambertSphereMaterial = new THREE.MeshLambertMaterial({ color: 0xFF0000 });
        const lambertsphere = new THREE.Mesh(lambertSphereGeometry, lambertSphereMaterial);
        lambertsphere.position.set(0, 1, -2);
        lambertsphere.castShadow = true;
        scene.add(lambertsphere);

        const phongSphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        const phongSphereMaterial = new THREE.MeshPhongMaterial({
            color: 0x0000FF,
            shininess: 100
        });
        const phongSphere = new THREE.Mesh(phongSphereGeometry, phongSphereMaterial);
        phongSphere.position.set(-2, 1, -2);
        phongSphere.castShadow = true;
        scene.add(phongSphere);

        const pbrSphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        const pbrSphereMaterial = new THREE.MeshStandardMaterial({
            color: 0xFFFF00,
            metalness: 0.8,
            roughness: 0.0
        });
        const pbrSphere = new THREE.Mesh(pbrSphereGeometry, pbrSphereMaterial);
        pbrSphere.position.set(1.5, 1, 1);
        pbrSphere.castShadow = true;
        scene.add(pbrSphere);

        // ------------------------------------------------------------------
        // โหลด โมเดล pbrr.glb และเชื่อมต่อ GUI
        // ------------------------------------------------------------------
        let loadedCharacter = null;
        let characterFolder = null;

        const loader = new THREE.GLTFLoader();
        loader.load('https://cdn.jsdelivr.net/gh/chayaponsaenthavee/Ball@main/pbrr.glb', (gltf) => {
            loadedCharacter = gltf.scene;
            loadedCharacter.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            loadedCharacter.position.set(0, 0, 0);
            scene.add(loadedCharacter);

            // เมื่อโมเดลถูกโหลดสำเร็จ ค่อยผูก Controller เข้ากับ GUI
            bindCharacterToGUI();
        });

        // ------------------------------------------------------------------
        // แยกส่วนสร้าง GUI ให้ทำงานทันทีโดยไม่ต้องรอไฟล์ GLB
        // ------------------------------------------------------------------
        function initGUI() {
            const gui = new lil.GUI({ title: 'PBR Controller' });

            // 1. Light Controller (แสดงผลทันที)
            const lightFolder = gui.addFolder('Light Source');
            lightFolder.add(directionalLight.position, 'x', -10, 10, 0.1);
            lightFolder.add(directionalLight.position, 'y', 0, 20, 0.1);
            lightFolder.add(directionalLight.position, 'z', -10, 10, 0.1);
            lightFolder.add(directionalLight, 'intensity', 0, 5, 0.1).name('Intensity');

            // 2. Character Folder (เตรียมไว้สำหรับอัปเดตค่าเมื่อโมเดลโหลดเสร็จ)
            characterFolder = gui.addFolder('Character PBR Attributes');
        }

        function bindCharacterToGUI() {
            if (loadedCharacter && characterFolder) {
                loadedCharacter.traverse((child) => {
                    if (child.isMesh && child.material) {
                        if (child.material.color) {
                            const params = { color: '#' + child.material.color.getHexString() };
                            characterFolder.addColor(params, 'color').name('Base Color').onChange((val) => {
                                child.material.color.set(val);
                            });
                        }
                        if (child.material.metalness !== undefined) {
                            characterFolder.add(child.material, 'metalness', 0, 1, 0.01).name('Metallic');
                        }
                        if (child.material.roughness !== undefined) {
                            characterFolder.add(child.material, 'roughness', 0, 1, 0.01).name('Roughness');
                        }
                    }
                });
            }
        }

        // เรียกสร้าง GUI อิสระทันที
        initGUI();

        const clock = new THREE.Clock();

        function animate() {
            const elapsedTime = clock.getElapsedTime();

            if (animeGroup) {
                animeGroup.rotation.y = Math.sin(elapsedTime * 2) * 0.35;
            }

            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
